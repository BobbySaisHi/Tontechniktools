// ===========================================================================
// Area 1 – spherical wave (view scaled in wavelengths) and zoom of r … r+λ
// ===========================================================================
const COLORS = {
    text: '#333', label: '#555', muted: '#666', grid: '#ddd',
    accent: '#0066cc', accentFill: 'rgba(0, 102, 204, 0.16)'
};
const WAVE = {
    viewLambda: 6,          // visible range from the source, in λ
    wedgeDeg: 22,           // half opening angle of the wedge
    rMin: 0.02, rMax: 5,    // displayable range of r/λ
    periodMs: 2000          // visual duration of one period (slowed down)
};

// Animation phase θ (rad). Shared by all areas so everything runs in sync.
const anim = { theta: 0, running: false, reduced: false, start: 0 };

// r/λ: true value and value held inside the displayable range
function waveGeometry() {
    const rl = state.r / Physics.wavelength(state.f);
    return { rl, rlDisp: Math.min(Math.max(rl, WAVE.rMin), WAVE.rMax) };
}

function updateWaveHint() {
    const { rl } = waveGeometry();
    const el = document.getElementById('wave-hint');
    const t = STRINGS[state.lang];
    if (rl < WAVE.rMin || rl > WAVE.rMax) {
        el.textContent = (rl < WAVE.rMin ? t.hintNear : t.hintFar).replace('{x}', fmtSig(rl));
        el.hidden = false;
    } else {
        el.hidden = true;
    }
}

// Prepare a canvas for HiDPI drawing at the given CSS height; returns ctx in CSS pixels
function setupCanvas(canvas, cssH) {
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth;
    if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        canvas.style.height = cssH + 'px';
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    return { ctx, w: cssW, h: cssH };
}

// Opacity of a wave front at distance r (in λ): proportional to 1/r (pressure amplitude
// of a spherical wave), limited to a visible range
const frontAlpha = (rl) => Math.min(1, Math.max(0.12, 1 / rl));

function drawWave(canvas) {
    const { rl, rlDisp } = waveGeometry();
    const tanW = Math.tan(WAVE.wedgeDeg * Math.PI / 180);
    const padL = 18, padR = 12, axisH = 34;
    const s = (canvas.clientWidth - padL - padR) / WAVE.viewLambda;   // px per λ
    const halfH = (WAVE.viewLambda * tanW + 0.15) * s;
    const { ctx, w, h } = setupCanvas(canvas, Math.round(2 * halfH + axisH));
    const x0 = padL, cy = halfH;
    const aW = WAVE.wedgeDeg * Math.PI / 180;

    // Crest positions: p ∝ cos(2π·r/λ − θ) → crests at r/λ = n + θ/2π.
    // If r is held at the edge, shift the pattern so that the phase at the measuring
    // point matches the true one.
    const shift = rl - rlDisp;
    const frac = ((anim.theta / (2 * Math.PI) - shift) % 1 + 1) % 1;
    const rMaxView = Math.hypot(w - x0, cy) / s;

    // Circular wave fronts: faint outside the wedge, full strength inside
    ctx.lineWidth = 1.5;
    for (let n = 0; n + frac <= rMaxView; n++) {
        const rc = n + frac;
        if (rc < 0.01) continue;
        const a = frontAlpha(rc);
        ctx.strokeStyle = `rgba(51, 51, 51, ${a * 0.2})`;
        ctx.beginPath();
        ctx.arc(x0, cy, rc * s, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(51, 51, 51, ${a})`;
        ctx.beginPath();
        ctx.arc(x0, cy, rc * s, -aW, aW);
        ctx.stroke();
    }

    // Wedge
    const wedgeLen = WAVE.viewLambda / Math.cos(aW) * s;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + Math.cos(aW) * wedgeLen, cy - Math.sin(aW) * wedgeLen);
    ctx.lineTo(x0, cy);
    ctx.lineTo(x0 + Math.cos(aW) * wedgeLen, cy + Math.sin(aW) * wedgeLen);
    ctx.stroke();
    ctx.setLineDash([]);

    // Highlighted section r … r+λ inside the wedge
    const r1 = rlDisp * s, r2 = (rlDisp + 1) * s;
    ctx.beginPath();
    ctx.arc(x0, cy, r2, -aW, aW);
    ctx.arc(x0, cy, r1, aW, -aW, true);
    ctx.closePath();
    ctx.fillStyle = COLORS.accentFill;
    ctx.fill();
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Source and measuring point
    ctx.fillStyle = COLORS.text;
    ctx.beginPath(); ctx.arc(x0, cy, 3.5, 0, 2 * Math.PI); ctx.fill();
    drawMeasuringPoint(ctx, x0 + r1, cy);

    // Axis in wavelengths
    const ya = h - axisH + 6;
    ctx.strokeStyle = COLORS.grid;
    ctx.beginPath(); ctx.moveTo(x0, ya); ctx.lineTo(x0 + WAVE.viewLambda * s, ya); ctx.stroke();
    ctx.fillStyle = COLORS.muted;
    ctx.font = '11px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let i = 0; i <= WAVE.viewLambda; i++) {
        const x = x0 + i * s;
        ctx.beginPath(); ctx.moveTo(x, ya - 3); ctx.lineTo(x, ya + 3); ctx.stroke();
        ctx.fillText(i === 0 ? '0' : i + ' λ', x, ya + 5);
    }
    ctx.textAlign = 'right';
    ctx.fillText(STRINGS[state.lang].waveAxis, w - padR, ya + 17);
    return h;
}

function drawMeasuringPoint(ctx, x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = COLORS.accent;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

// Zoom: section r … r+λ stretched to a fixed box. Length λ → box width, height at r+λ
// → box height, height at r scaled by r/(r+λ). Close to the source this is a pointed
// wedge, in the far field almost a rectangle (plane wave). Uses the true r/λ.
function drawZoom(canvas, cssH) {
    const { rl } = waveGeometry();
    const { ctx, w, h } = setupCanvas(canvas, cssH);
    const padX = 16, padTop = 14, padBottom = 30;
    const x1 = padX, x2 = w - padX;
    const cy = padTop + (h - padTop - padBottom) / 2;
    const hOut = h - padTop - padBottom;
    const hAt = (u) => hOut * (rl + u) / (rl + 1);   // u = position in the section, 0 … 1 λ
    const xAt = (u) => x1 + u * (x2 - x1);

    // Section outline
    ctx.beginPath();
    ctx.moveTo(x1, cy - hAt(0) / 2);
    ctx.lineTo(x2, cy - hOut / 2);
    ctx.lineTo(x2, cy + hOut / 2);
    ctx.lineTo(x1, cy + hAt(0) / 2);
    ctx.closePath();
    ctx.fillStyle = COLORS.accentFill;
    ctx.fill();
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wave fronts inside the section; opacity ∝ 1/r as in the main view
    const frac = ((anim.theta / (2 * Math.PI)) % 1 + 1) % 1;
    const u0 = ((frac - rl) % 1 + 1) % 1;   // first crest position inside the section
    ctx.lineWidth = 2;
    for (const u of [u0, u0 + 1]) {
        if (u > 1) continue;
        const a = Math.max(0.3, frontAlpha(rl + u));
        ctx.strokeStyle = `rgba(51, 51, 51, ${a})`;
        ctx.beginPath();
        ctx.moveTo(xAt(u), cy - hAt(u) / 2);
        ctx.lineTo(xAt(u), cy + hAt(u) / 2);
        ctx.stroke();
    }

    drawMeasuringPoint(ctx, x1, cy);

    // Labels
    const t = STRINGS[state.lang];
    ctx.fillStyle = COLORS.muted;
    ctx.font = '11px Arial, sans-serif';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(t.zoomInner, x1 - 4, h - padBottom + 8);
    ctx.textAlign = 'right';
    ctx.fillText(t.zoomOuter, x2 + 4, h - padBottom + 8);
}

// ===========================================================================
// Area 2 – pressure p and particle velocity v·ρc at the measuring point
// ===========================================================================
// With θ = ωt and the wave fronts of area 1 (crests where k·r = θ + 2πn):
//   p(t)    = (1 m / r) · cos(θ − kr)
//   v·ρc(t) = (1 m / r) · |N| · cos(θ − kr − φ),  φ = arctan(1/(kr))  (v lags p)
// Amplitudes relative to p at r = 1 m. Source: Beranek & Mellow 2012 (see Physics.N).
// Two y-scale modes:
//  'auto'  – the larger curve (always v·ρc, since |N| ≥ 1) fills the height
//  'fixed' – fixed linear scale, adjustable by slider, not renormalised per distance,
//            so the 1/r decrease stays visible; larger values are clipped with a hint.
// The x axis (3 periods) is fixed in both modes.
const TIME = { periods: 3, height: 280 };
const TIME_SLIDER = { min: 0.1, max: 100000 };   // log slider for the fixed y range

function timeAmplitudes() {
    const kr = Physics.waveNumber(state.f) * state.r;
    return { kr, pA: Physics.pressureRel(state.r), vA: Physics.velocityRel(kr, state.r) };
}

const timeYMax = (vA) => (state.timeMode === 'auto' ? vA : state.timeYMax);

function buildTimeControls() {
    document.querySelectorAll('#time-mode button').forEach(b =>
        b.addEventListener('click', () => { state.timeMode = b.dataset.mode; update(); }));
    const input = document.getElementById('sl-timeYMax');
    input.value = valueToPos(TIME_SLIDER, state.timeYMax);
    input.addEventListener('input', () => {
        state.timeYMax = posToValue(TIME_SLIDER, +input.value);
        update();
    });
}

function updateTimeControls() {
    document.querySelectorAll('#time-mode button').forEach(b =>
        b.classList.toggle('active', b.dataset.mode === state.timeMode));
    document.getElementById('time-scale').hidden = state.timeMode !== 'fixed';
    document.getElementById('val-timeYMax').textContent = '±' + fmtSig(state.timeYMax);
}

function updateTimeHint() {
    const { pA, vA } = timeAmplitudes();
    const t = STRINGS[state.lang];
    const yMax = timeYMax(vA);
    const parts = [];
    if (state.timeMode === 'fixed') {
        if (pA > yMax) parts.push(t.clippedP.replace('{x}', fmtSig(pA)));
        if (vA > yMax) parts.push(t.clippedV.replace('{x}', fmtSig(vA)));
    }
    const el = document.getElementById('time-hint');
    el.hidden = parts.length === 0;
    if (parts.length)
        el.textContent = t.hintClipped.replace('{list}', parts.join(', ')).replace('{max}', fmtSig(yMax));
}

function drawTime(canvas) {
    const t = STRINGS[state.lang];
    const { kr, pA, vA } = timeAmplitudes();
    const phi = Math.atan(1 / kr);
    const yMax = timeYMax(vA);

    const { ctx, w, h } = setupCanvas(canvas, TIME.height);
    ctx.font = '11px Arial, sans-serif';
    const yLabelW = ctx.measureText('−' + fmtSig(yMax)).width;
    const padL = Math.max(34, Math.ceil(yLabelW) + 12), padR = 46, padT = 30, padB = 38;
    const x0 = padL, x1 = w - padR;
    const cy = padT + (h - padT - padB) / 2;
    const amp = (h - padT - padB) / 2;
    const span = TIME.periods * 2 * Math.PI;
    // x position for time offset τ (rad) relative to now: τ = −span … 0
    const xAt = (tau) => x1 + (tau / span) * (x1 - x0);
    // values beyond the fixed scale are clipped at the edge
    const yAt = (val) => cy - (Math.max(-yMax, Math.min(yMax, val)) / yMax) * amp;

    // Grid: zero line, y ticks, period ticks
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, cy); ctx.lineTo(x1, cy);
    ctx.moveTo(x0, cy - amp); ctx.lineTo(x0, cy + amp);
    ctx.stroke();
    ctx.fillStyle = COLORS.muted;
    ctx.font = '11px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (const val of [-yMax, -yMax / 2, yMax / 2, yMax]) {
        const y = yAt(val);
        ctx.strokeStyle = '#eee';
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
        ctx.fillText(fmtSig(val).replace('-', '−'), x0 - 5, y);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.timeYUnit, w - 6, 12);
    ctx.strokeStyle = COLORS.grid;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (let i = TIME.periods; i >= 1; i--) {
        const x = xAt(-i * 2 * Math.PI);
        ctx.beginPath(); ctx.moveTo(x, cy + amp); ctx.lineTo(x, cy + amp + 4); ctx.stroke();
        ctx.fillText(`−${i} T`, x, cy + amp + 9);
    }
    ctx.textAlign = 'right';
    ctx.fillText(t.timeAxis, x1, h - 12);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('0', x0 - 5, cy);

    // Curves
    const curve = (fn, color, dash) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash(dash);
        ctx.beginPath();
        const steps = Math.max(200, Math.round(x1 - x0));
        for (let i = 0; i <= steps; i++) {
            const tau = -span + span * i / steps;
            const y = yAt(fn(anim.theta + tau));
            i ? ctx.lineTo(xAt(tau), y) : ctx.moveTo(xAt(tau), y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    };
    const p = (th) => pA * Math.cos(th - kr);
    const v = (th) => vA * Math.cos(th - kr - phi);
    curve(v, COLORS.text, [6, 4]);
    curve(p, COLORS.accent, []);

    // "Now" marker with current values
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(x1, padT - 6); ctx.lineTo(x1, cy + amp + 4); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = COLORS.muted;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(t.now, x1, cy + amp + 9);
    for (const [fn, color] of [[v, COLORS.text], [p, COLORS.accent]]) {
        ctx.beginPath();
        ctx.arc(x1, yAt(fn(anim.theta)), 4, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
    }

    // Legend
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = '12px Arial, sans-serif';
    let lx = x0;
    for (const [label, color, dash] of [[t.legendP, COLORS.accent, []], [t.legendV, COLORS.text, [6, 4]]]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(lx, 12); ctx.lineTo(lx + 24, 12); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = COLORS.text;
        ctx.fillText(label, lx + 30, 12);
        lx += 30 + ctx.measureText(label).width + 20;
    }
}

// ===========================================================================
// Area 3 – frequency response on axis (0°), normalised to 1 kHz
// ===========================================================================
const FREQ = {
    height: 360,
    // full view (reset target)
    fMin: 20, fMax: 20000,
    dbMin: -40, dbMax: 40,
    // zoom limits
    minRatio: 1.25,   // smallest visible fMax/fMin
    minDbSpan: 3      // smallest visible level span, dB
};

// Curves of the frequency plot. Each view shows one set (see VIEWS[view].curves).
// level(f, opts) returns the level normalised to 1 kHz.
const lvl = (p, f, o) => Physics.levelNormDb(p, f, state.r, state.rH, state.D, o);
const PATTERN_STYLE = {
    omni:     { color: COLORS.accent, dash: [],     width: 2,   label: 'patOmni', level: (f, o) => lvl('omni', f, o) },
    cardioid: { color: COLORS.text,   dash: [],     width: 2,   label: 'patCard', level: (f, o) => lvl('cardioid', f, o) },
    fig8:     { color: COLORS.text,   dash: [6, 4], width: 2,   label: 'patFig8', level: (f, o) => lvl('fig8', f, o) },
    // omni only (room view): on-axis free field, diffuse field, sum at the current distance
    axis:     { color: COLORS.accent, dash: [6, 4], width: 2,   label: 'curveAxis',
                level: (f, o) => lvl('omni', f, { ...o, part: 'direct' }) },
    diff:     { color: '#888',        dash: [],     width: 2,   label: 'curveDiff',
                level: (f, o) => lvl('omni', f, { ...o, part: 'diffuse' }) },
    sum:      { color: COLORS.text,   dash: [],     width: 2.5, label: 'curveSum', level: (f, o) => lvl('omni', f, o) }
};
const curveOpts = () => ({ ...VIEWS[state.view].opts, eq: { omni: state.omniEq } });

// Current view of the frequency plot (zoomed by dragging a rectangle)
const freqView = { fMin: FREQ.fMin, fMax: FREQ.fMax, dbMin: FREQ.dbMin, dbMax: FREQ.dbMax };
let freqGeom = null;   // plot geometry of the last drawing, used for mouse mapping
let freqDrag = null;   // { xa, ya, xb, yb } while a zoom rectangle is dragged
let freqHover = null;  // { x, y } mouse position for the value readout

// Small tooltip box with several text rows, kept inside the plot area
function drawTooltip(ctx, x, y, rows, x0, x1, y0, y1) {
    ctx.font = '12px Arial, sans-serif';
    const lineH = 16, pad = 6;
    const bw = Math.max(...rows.map(r => {
        ctx.font = (r.bold ? 'bold ' : '') + '12px Arial, sans-serif';
        return ctx.measureText(r.text).width;
    })) + 2 * pad;
    const bh = rows.length * lineH + 2 * pad - 4;
    let bx = x + 12, by = y - bh / 2;
    if (bx + bw > x1) bx = x - 12 - bw;
    by = Math.min(Math.max(by, y0 + 2), y1 - bh - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.strokeStyle = '#bbb';
    ctx.lineWidth = 1;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    rows.forEach((r, i) => {
        ctx.font = (r.bold ? 'bold ' : '') + '12px Arial, sans-serif';
        ctx.fillStyle = r.color;
        ctx.fillText(r.text, bx + pad, by + pad + i * lineH);
    });
}

// default level range of the current view (room view: ±20 dB, otherwise ±40 dB)
const viewDb = () => VIEWS[state.view].db || [FREQ.dbMin, FREQ.dbMax];
const isFreqZoomed = () => freqView.fMin !== FREQ.fMin || freqView.fMax !== FREQ.fMax ||
    freqView.dbMin !== viewDb()[0] || freqView.dbMax !== viewDb()[1];

function resetFreqView() {
    Object.assign(freqView, { fMin: FREQ.fMin, fMax: FREQ.fMax, dbMin: viewDb()[0], dbMax: viewDb()[1] });
}

function resetFreqZoom() {
    resetFreqView();
    update();
}

function buildFreqControls() {
    const box = document.getElementById('freq-patterns');
    for (const p of Object.keys(PATTERN_STYLE)) {
        const st = PATTERN_STYLE[p];
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.pattern = p;
        b.setAttribute('aria-pressed', 'true');
        b.innerHTML = `<svg width="22" height="8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4"
            stroke="${st.color}" stroke-width="2" stroke-dasharray="${st.dash.join(' ')}"/></svg>
            <span data-i18n="${st.label}"></span>`;
        b.addEventListener('click', () => { state.show[p] = !state.show[p]; update(); });
        box.appendChild(b);
    }
    document.getElementById('freq-reset').addEventListener('click', resetFreqZoom);
    document.querySelectorAll('#eq-omni button').forEach(b =>
        b.addEventListener('click', () => { state.omniEq = b.dataset.eq; update(); }));

    // Zoom by dragging a rectangle with the mouse (x and y at the same time)
    const canvas = document.getElementById('freq-canvas');
    const pos = (e) => {
        const rc = canvas.getBoundingClientRect();
        const g = freqGeom;
        return {
            x: Math.min(g.x1, Math.max(g.x0, e.clientX - rc.left)),
            y: Math.min(g.y1, Math.max(g.y0, e.clientY - rc.top))
        };
    };
    canvas.addEventListener('mousedown', (e) => {
        if (!freqGeom || e.button !== 0) return;
        const p = pos(e);
        freqDrag = { xa: p.x, ya: p.y, xb: p.x, yb: p.y };
        e.preventDefault();
    });
    // value readout under the mouse cursor (frequency and levels)
    canvas.addEventListener('mousemove', (e) => {
        if (!freqGeom || freqDrag) return;
        const rc = canvas.getBoundingClientRect(), g = freqGeom;
        const x = e.clientX - rc.left, y = e.clientY - rc.top;
        freqHover = (x >= g.x0 && x <= g.x1 && y >= g.y0 && y <= g.y1) ? { x, y } : null;
        drawFreq(canvas);
    });
    canvas.addEventListener('mouseleave', () => { freqHover = null; drawFreq(canvas); });
    window.addEventListener('mousemove', (e) => {
        if (!freqDrag) return;
        const p = pos(e);
        freqDrag.xb = p.x; freqDrag.yb = p.y;
        drawFreq(canvas);
    });
    window.addEventListener('mouseup', () => {
        if (!freqDrag) return;
        const d = freqDrag, g = freqGeom;
        freqDrag = null;
        if (Math.abs(d.xb - d.xa) > 6 && Math.abs(d.yb - d.ya) > 6) {
            let fMin = g.fAt(Math.min(d.xa, d.xb)), fMax = g.fAt(Math.max(d.xa, d.xb));
            let dbMin = g.dbAt(Math.max(d.ya, d.yb)), dbMax = g.dbAt(Math.min(d.ya, d.yb));
            // enforce a minimum zoom window around the centre
            if (fMax / fMin < FREQ.minRatio) {
                const c = Math.sqrt(fMin * fMax), s = Math.sqrt(FREQ.minRatio);
                fMin = c / s; fMax = c * s;
            }
            if (dbMax - dbMin < FREQ.minDbSpan) {
                const c = (dbMin + dbMax) / 2;
                dbMin = c - FREQ.minDbSpan / 2; dbMax = c + FREQ.minDbSpan / 2;
            }
            Object.assign(freqView, { fMin, fMax, dbMin, dbMax });
        }
        update();
    });
}

function updateFreqControls() {
    const t = STRINGS[state.lang];
    const cfg = VIEWS[state.view];
    document.querySelectorAll('#freq-patterns button').forEach(b => {
        const on = state.show[b.dataset.pattern];
        b.hidden = !cfg.curves.includes(b.dataset.pattern);
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
    });
    document.getElementById('freq-reset').disabled = !isFreqZoomed();
    // equalisation switch: hidden in the near-field view (ideal transducers)
    document.getElementById('eq-row').hidden = !cfg.eq;
    document.getElementById('eq-explain').hidden = !cfg.eq;
    document.getElementById('eq-other').hidden = !cfg.curves.includes('cardioid');
    document.querySelectorAll('#eq-omni button').forEach(b =>
        b.classList.toggle('active', b.dataset.eq === state.omniEq));
    document.getElementById('eq-explain').textContent = t['eqExplain_' + state.omniEq];
    document.getElementById('freq-caption').textContent = t['freqCaption_' + state.view];
    document.getElementById('polar-fig').hidden = !cfg.polar;
}

// Simplified polar pattern of the omni at the selected frequency (room view).
// r(θ) = G0 · |(1 − B) + B·cos θ|, 0° (towards the source) at the top.
function drawPolar(canvas) {
    const t = STRINGS[state.lang];
    const { q, qShown, b, g0 } = Physics.omniPolar(state.f, state.D);
    const { ctx, w, h } = setupCanvas(canvas, FREQ.height);
    const cx0 = w / 2, cy0 = h / 2;
    const rMaxVal = 2;                                   // G0 reaches at most 2 (+6 dB)
    const R = Math.min(w, h) / 2 - 22;
    const rad = (v) => v / rMaxVal * R;

    // grid: rings at 0.5, 1, 1.5, 2 and spokes every 30°
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (const v of [0.5, 1, 1.5, 2]) {
        ctx.beginPath(); ctx.arc(cx0, cy0, rad(v), 0, 2 * Math.PI); ctx.stroke();
    }
    for (let a = 0; a < 180; a += 30) {
        const th = a * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(cx0 + R * Math.sin(th), cy0 - R * Math.cos(th));
        ctx.lineTo(cx0 - R * Math.sin(th), cy0 + R * Math.cos(th));
        ctx.stroke();
    }
    ctx.font = '11px Arial, sans-serif';
    ctx.fillStyle = COLORS.muted;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('0°', cx0, cy0 - R - 4);
    ctx.textBaseline = 'top';
    ctx.fillText('180°', cx0, cy0 + R + 4);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('90°', cx0 + R + 3, cy0);
    ctx.textAlign = 'right';
    ctx.fillText('270°', cx0 - R - 3, cy0);
    ctx.textAlign = 'left';
    for (const v of [1, 2]) ctx.fillText(String(v), cx0 + 3, cy0 - rad(v) + 7);

    // ideal omni (reference)
    ctx.strokeStyle = '#999';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(cx0, cy0, rad(1), 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);

    // simplified pattern
    ctx.beginPath();
    for (let i = 0; i <= 360; i++) {
        const th = i * Math.PI / 180;
        const v = g0 * Math.abs((1 - b) + b * Math.cos(th));
        const x = cx0 + rad(v) * Math.sin(th), y = cy0 - rad(v) * Math.cos(th);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = COLORS.accentFill;
    ctx.fill();
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    document.getElementById('polar-caption').textContent = t.polarCaption
        .replace('{f}', fmtFreq(state.f))
        .replace('{q}', fmtSig(q))
        .replace('{cap}', q > qShown ? t.polarCapped : '')
        .replace('{g}', fmtDb(20 * Math.log10(g0)));
}

// Frequency ticks in a 1-2-5 sequence; denser if the view is narrow
function freqTicks(fMin, fMax) {
    const make = (mant) => {
        const out = [];
        for (let e = Math.floor(Math.log10(fMin)); e <= Math.ceil(Math.log10(fMax)); e++)
            for (const m of mant) {
                const f = m * Math.pow(10, e);
                if (f >= fMin * 0.999 && f <= fMax * 1.001) out.push(f);
            }
        return out;
    };
    let ticks = make([1, 2, 5]);
    if (ticks.length < 5) ticks = make([1, 1.5, 2, 3, 4, 5, 6, 7, 8, 9]);
    if (ticks.length < 3) ticks = make([1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9,
        2, 2.5, 3, 3.5, 4, 4.5, 5, 6, 7, 8, 9]);
    return ticks;
}

// Level grid step so that at most ~10 lines are visible
function dbStep(span) {
    for (const s of [1, 2, 5, 10, 20]) if (span / s <= 10) return s;
    return 20;
}

const fmtTickFreq = (f) => (f < 1000
    ? f.toLocaleString(locale(), { maximumFractionDigits: 1 })
    : (f / 1000).toLocaleString(locale(), { maximumFractionDigits: 2 }) + 'k');

function drawFreq(canvas) {
    const t = STRINGS[state.lang];
    const v = freqView;
    const { ctx, w, h } = setupCanvas(canvas, FREQ.height);
    const padL = 40, padR = 14, padT = 30, padB = 36;
    const x0 = padL, x1 = w - padR, y0 = padT, y1 = h - padB;
    const lMin = Math.log10(v.fMin), lMax = Math.log10(v.fMax);
    const xAt = (f) => x0 + (Math.log10(f) - lMin) / (lMax - lMin) * (x1 - x0);
    const fAt = (x) => Math.pow(10, lMin + (x - x0) / (x1 - x0) * (lMax - lMin));
    const yAt = (db) => y0 + (v.dbMax - db) / (v.dbMax - v.dbMin) * (y1 - y0);
    const dbAt = (y) => v.dbMax - (y - y0) / (y1 - y0) * (v.dbMax - v.dbMin);
    freqGeom = { x0, x1, y0, y1, fAt, dbAt };

    // Grid and axes
    ctx.font = '11px Arial, sans-serif';
    ctx.fillStyle = COLORS.muted;
    ctx.lineWidth = 1;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const step = dbStep(v.dbMax - v.dbMin);
    for (let db = Math.ceil(v.dbMin / step) * step; db <= v.dbMax + 1e-9; db += step) {
        const y = yAt(db);
        ctx.strokeStyle = db === 0 ? '#bbb' : '#eee';
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
        ctx.fillText((db > 0 ? '+' : db < 0 ? '−' : '') + Math.abs(db), x0 - 5, y);
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const f of freqTicks(v.fMin, v.fMax)) {
        const x = xAt(f);
        ctx.strokeStyle = '#eee';
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
        ctx.fillText(fmtTickFreq(f), x, y1 + 5);
    }
    ctx.strokeStyle = COLORS.grid;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.textAlign = 'right';
    ctx.fillText(t.freqAxis, x1, y1 + 19);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(t.levelAxis, 4, y0 - 12);

    // Vertical markers: transition frequency (k·r = 1) and selected frequency f
    const marker = (f, color, dash, label, row) => {
        const inside = f >= v.fMin && f <= v.fMax;
        const x = xAt(Math.min(v.fMax, Math.max(v.fMin, f)));
        ctx.textBaseline = 'top';
        if (inside) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.setLineDash(dash);
            ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
            ctx.setLineDash([]);
        }
        const text = inside ? label
            : (f < v.fMin ? '◄ ' : '') + label + ': ' + fmtFreq(f) + (f > v.fMax ? ' ►' : '');
        const tw = ctx.measureText(text).width;
        let tx = inside ? x + 4 : (f < v.fMin ? x0 + 4 : x1 - 4 - tw);
        if (tx + tw > x1 - 2) tx = x - 4 - tw;
        const ty = y0 + 4 + row * 15;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(tx - 2, ty - 1, tw + 4, 14);
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.fillText(text, tx, ty);
    };
    // transition frequency only where the proximity effect is modelled
    if (VIEWS[state.view].opts.near) marker(Physics.transitionFreq(state.r), COLORS.muted, [4, 4], t.markTrans, 1);
    marker(state.f, COLORS.accent, [2, 3], t.markF, 0);

    // Curves of the current view (clipped to the plot area)
    const opts = curveOpts();
    const level = (p, f) => PATTERN_STYLE[p].level(f, opts);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    for (const p of VIEWS[state.view].curves) {
        if (!state.show[p]) continue;
        const st = PATTERN_STYLE[p];
        ctx.strokeStyle = st.color;
        ctx.lineWidth = st.width;
        ctx.setLineDash(st.dash);
        ctx.beginPath();
        for (let x = x0; x <= x1; x += 1) {
            const y = yAt(level(p, fAt(x)));
            x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        // dot at the selected frequency
        ctx.fillStyle = st.color;
        ctx.beginPath(); ctx.arc(xAt(state.f), yAt(level(p, state.f)), 3.5, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.restore();

    // Value readout at the mouse cursor: frequency and level of each visible curve
    if (freqHover && !freqDrag) {
        const fh = fAt(freqHover.x);
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(freqHover.x, y0); ctx.lineTo(freqHover.x, y1); ctx.stroke();
        const rows = [{ text: fmtFreq(fh), color: COLORS.text, bold: true }];
        for (const p of VIEWS[state.view].curves) {
            if (!state.show[p]) continue;
            const db = level(p, fh);
            ctx.fillStyle = PATTERN_STYLE[p].color;
            ctx.beginPath(); ctx.arc(freqHover.x, yAt(db), 3, 0, 2 * Math.PI); ctx.fill();
            rows.push({ text: `${t[PATTERN_STYLE[p].label]}: ${fmtDb(db)}`, color: PATTERN_STYLE[p].color });
        }
        drawTooltip(ctx, freqHover.x, freqHover.y, rows, x0, x1, y0, y1);
    }

    // Zoom rectangle while dragging
    if (freqDrag) {
        const d = freqDrag;
        const rx = Math.min(d.xa, d.xb), ry = Math.min(d.ya, d.yb);
        const rw = Math.abs(d.xb - d.xa), rh = Math.abs(d.yb - d.ya);
        ctx.fillStyle = COLORS.accentFill;
        ctx.fillRect(rx, ry, rw, rh);
        ctx.strokeStyle = COLORS.accent;
        ctx.lineWidth = 1;
        ctx.strokeRect(rx, ry, rw, rh);
    }
}

// ===========================================================================
// Block 1 – microphone and source: schematic top view of a hall
// ===========================================================================
// World coordinates in metres: x points from the singer's mouth (x = 0) towards the
// audience, y is lateral. The microphone sits on the axis at x = r, facing the mouth.
// The visible section depends on the view: close-up (proximity effect), whole hall
// (free-field/diffuse-field), or whole hall plus a close-up inset (overview).
const SCENE = {
    closeUp: { x0: -0.35, x1: 1.15, y0: -0.3, y1: 0.3 },
    hall:    { x0: -4.5,  x1: 11.2, y0: -3.2, y1: 3.2 },
    stageBack: -7, stageEdge: 2,          // stage from x = −7 m to the edge at x = 2 m
    firstRow: 3, rowGap: 0.9, rows: 10,   // audience rows in front of the stage
    seatGap: 0.55, seat: 0.36, aisle: 0.6,
    headR: 0.09                           // head radius, m
};

// Share of direct and diffuse energy at the microphone (omni, broadband):
// direct ∝ (r_H/r)², diffuse = 1 → equal at r = r_H (definition of the critical distance)
function directShare(r, rH) {
    const d = Math.pow(rH / r, 2);
    return d / (d + 1);
}

function drawArrow(ctx, xa, ya, xb, yb, width, color) {
    const len = Math.hypot(xb - xa, yb - ya);
    if (len < 4) return;
    const ux = (xb - xa) / len, uy = (yb - ya) / len;
    const head = Math.min(len * 0.6, 6 + width * 1.6);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    ctx.lineTo(xb - ux * head * 0.8, yb - uy * head * 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xb, yb);
    ctx.lineTo(xb - ux * head - uy * head * 0.55, yb - uy * head + ux * head * 0.55);
    ctx.lineTo(xb - ux * head + uy * head * 0.55, yb - uy * head - ux * head * 0.55);
    ctx.closePath();
    ctx.fill();
}

// Draw the scene for world window `win` into the pixel rectangle `rc`
function drawSceneView(ctx, rc, win, opts = {}) {
    const t = STRINGS[state.lang];
    const s = Math.min(rc.w / (win.x1 - win.x0), rc.h / (win.y1 - win.y0));   // px per m
    const cxw = (win.x0 + win.x1) / 2, cyw = (win.y0 + win.y1) / 2;
    const X = (x) => rc.x + rc.w / 2 + (x - cxw) * s;
    const Y = (y) => rc.y + rc.h / 2 + (y - cyw) * s;
    const visX0 = cxw - rc.w / 2 / s, visX1 = cxw + rc.w / 2 / s;
    const visY0 = cyw - rc.h / 2 / s, visY1 = cyw + rc.h / 2 / s;

    ctx.save();
    ctx.beginPath(); ctx.rect(rc.x, rc.y, rc.w, rc.h); ctx.clip();
    ctx.fillStyle = 'white';
    ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    ctx.font = '11px Arial, sans-serif';

    // Stage floor and stage edge
    ctx.fillStyle = '#f1f1f1';
    ctx.fillRect(X(SCENE.stageBack), Y(visY0), (SCENE.stageEdge - SCENE.stageBack) * s, (visY1 - visY0) * s);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X(SCENE.stageEdge), Y(visY0)); ctx.lineTo(X(SCENE.stageEdge), Y(visY1)); ctx.stroke();

    // Audience rows with a centre aisle
    ctx.fillStyle = '#ebebeb';
    for (let i = 0; i < SCENE.rows; i++) {
        const x = SCENE.firstRow + i * SCENE.rowGap;
        if (x > visX1 || x + SCENE.seat < visX0) continue;
        for (let y = SCENE.aisle; y < Math.max(-visY0, visY1) + 1; y += SCENE.seatGap)
            for (const sy of [y, -y - SCENE.seat])
                ctx.fillRect(X(x), Y(sy), SCENE.seat * s, SCENE.seat * s);
    }

    // Labels (stage, edge, audience) if the hall is visible
    if (!opts.closeUp) {
        ctx.fillStyle = COLORS.muted;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
        ctx.fillText(t.sceneStage, X(visX0) + 8, rc.y + 6);
        ctx.save();
        ctx.translate(X(SCENE.stageEdge) - 6, rc.y + rc.h - 8);
        ctx.rotate(-Math.PI / 2);
        ctx.textBaseline = 'bottom';
        ctx.fillText(t.sceneEdge, 0, 0);
        ctx.restore();
        const ax = X(SCENE.firstRow), aw = ctx.measureText(t.sceneAudience).width;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(ax - 2, rc.y + 4, aw + 4, 15);
        ctx.fillStyle = COLORS.muted;
        ctx.fillText(t.sceneAudience, ax, rc.y + 6);
    }

    // Critical distance as a circle around the mouth
    ctx.strokeStyle = COLORS.accent;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(X(0), Y(0), state.rH * s, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);
    {
        // label at the top of the circle (or at the right, whichever is visible)
        const label = `${t.sceneRH} = ${fmtLen(state.rH)}`;
        const R = state.rH, m = 0.06 * (visY1 - visY0);
        // candidate points on the circle: 45° up-right, crossing with the top edge,
        // crossing with the right edge
        const cand = [[R * Math.SQRT1_2, -R * Math.SQRT1_2]];
        const yt = visY0 + m;
        if (R > Math.abs(yt)) cand.push([Math.sqrt(R * R - yt * yt), yt]);
        const xr = visX1 - 0.25 * (visX1 - visX0);
        if (R > Math.abs(xr)) cand.push([xr, -Math.sqrt(R * R - xr * xr)]);
        const lwPx = ctx.measureText(label).width + 10;
        const ok = cand.find(([x, y]) => x > visX0 && X(x) + lwPx < rc.x + rc.w - 4 &&
            y > visY0 + 0.5 * m && y < visY1);
        if (ok) {
            const lx = X(ok[0]), ly = Y(ok[1]);
            const lw = ctx.measureText(label).width;
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(lx + 2, ly - 7, lw + 4, 14);
            ctx.fillStyle = COLORS.accent;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, lx + 4, ly);
        }
    }

    // Singer: head with nose (pointing to +x) and ears, drawn at least 8 px in radius
    const hr = Math.max(SCENE.headR * s, 8);
    const hx = X(0) - hr, hy = Y(0);
    ctx.fillStyle = '#ddd';
    ctx.strokeStyle = COLORS.text;
    ctx.lineWidth = 1.5;
    for (const sgn of [-1, 1]) {   // ears
        ctx.beginPath();
        ctx.ellipse(hx, hy + sgn * hr, hr * 0.22, hr * 0.32, 0, 0, 2 * Math.PI);
        ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.beginPath();   // nose
    ctx.moveTo(hx + hr * 0.92, hy - hr * 0.2);
    ctx.lineTo(hx + hr * 1.28, hy);
    ctx.lineTo(hx + hr * 0.92, hy + hr * 0.2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Microphone on the axis at x = r, capsule towards the mouth
    const r = state.r;
    const inView = r <= visX1 - 0.02 * (visX1 - visX0);
    const share = directShare(r, state.rH);
    if (inView) {
        const capR = Math.max(state.D / 2 * s, 4);
        const mx = X(r) + capR, my = Y(0);          // capsule centre, front of capsule at x = r
        // direct sound: arrow from the mouth to the capsule
        drawArrow(ctx, X(0) + 3, my, mx - capR - 2, my, 1.2 + 6 * share, COLORS.accent);
        // diffuse sound: short arrows from all around
        const dw = 1 + 4.5 * (1 - share);
        for (let k = 0; k < 8; k++) {
            const a = (k + 0.5) * Math.PI / 4;
            const r1 = capR + 34, r2 = capR + 8;
            drawArrow(ctx, mx + r1 * Math.cos(a), my + r1 * Math.sin(a),
                mx + r2 * Math.cos(a), my + r2 * Math.sin(a), dw, '#888');
        }
        // body (handle) pointing away from the source
        const bodyL = Math.max(0.16 * s, 18), bodyW = Math.max(capR * 1.1, 5);
        ctx.fillStyle = '#555';
        ctx.fillRect(mx, my - bodyW / 2, bodyL, bodyW);
        ctx.beginPath(); ctx.arc(mx, my, capR, 0, 2 * Math.PI);
        ctx.fillStyle = COLORS.text; ctx.fill();
        ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.stroke();

        // distance dimension line below the axis
        const dy = my + Math.max(hr, capR) + 46;
        ctx.strokeStyle = COLORS.muted;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(X(0), dy - 5); ctx.lineTo(X(0), dy + 5);
        ctx.moveTo(X(r), dy - 5); ctx.lineTo(X(r), dy + 5);
        ctx.moveTo(X(0), dy); ctx.lineTo(X(r), dy);
        ctx.stroke();
        const lbl = 'r = ' + fmtLen(r);
        const lw = ctx.measureText(lbl).width;
        let lx = (X(0) + X(r)) / 2 - lw / 2;
        if (X(r) - X(0) < lw + 8) lx = X(r) + 6;
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(lbl, lx, dy + 4);
    } else {
        // microphone outside this section: point to it
        const lbl = `${t.sceneMic}: r = ${fmtLen(r)} ►`;
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(lbl, rc.x + rc.w - 6, Y(0) + 22);
    }
    ctx.restore();
    return share;
}

function drawScene(canvas) {
    const t = STRINGS[state.lang];
    const cssW = canvas.clientWidth;
    const H = Math.round(Math.min(440, Math.max(240, cssW * 0.36)));
    const { ctx, w, h } = setupCanvas(canvas, H);
    const full = { x: 0, y: 0, w, h };
    let share;
    if (state.view === 'near') {
        share = drawSceneView(ctx, full, SCENE.closeUp, { closeUp: true });
    } else {
        share = drawSceneView(ctx, full, SCENE.hall);
        if (state.view === 'overview') {
            // close-up inset in the upper right corner
            const iw = Math.round(w * 0.34), ih = Math.round(h * 0.42);
            const inset = { x: w - iw - 8, y: 8, w: iw, h: ih };
            drawSceneView(ctx, inset, SCENE.closeUp, { closeUp: true });
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.strokeRect(inset.x, inset.y, inset.w, inset.h);
            ctx.font = '11px Arial, sans-serif';
            ctx.fillStyle = COLORS.muted;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(t.sceneInset, inset.x + 5, inset.y + 4);
        }
    }

    // Legend with the energy shares (bottom left)
    const txt = t.sceneShare.replace('{d}', fmtSig(Math.round(100 * share)))
        .replace('{x}', fmtSig(Math.round(100 * (1 - share))));
    ctx.font = '12px Arial, sans-serif';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(4, h - 26, tw + 12, 22);
    ctx.fillStyle = COLORS.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, 10, h - 15);
}

// ===========================================================================
// Distance map (overview): level re 1 kHz over frequency (x) and distance (y)
// ===========================================================================
const MAP = {
    height: 330,
    cols: 120, rows: 80,            // coarse grid, scaled up smoothly
    fMin: 20, fMax: 20000,
    rMin: 0.01, rMax: 10,
    dbLim: 15,                      // colour scale limited to ±15 dB
    rTicks: [0.01, 0.03, 0.1, 0.3, 1, 3, 10],
    fTicks: [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]
};
const mapCache = { key: '', img: null };
let mapGeom = null;
let mapHover = null;   // { x, y } mouse position for the value readout

// Diverging colour scale: attenuated → cool (accent blue), 0 dB → white, boosted → warm
function mapColor(db) {
    const v = Math.max(-1, Math.min(1, db / MAP.dbLim));
    const cool = [0, 102, 204], warm = [214, 72, 15], white = [255, 255, 255];
    const c = v < 0 ? cool : warm, a = Math.abs(v);
    return white.map((w, i) => Math.round(w + (c[i] - w) * a));
}

function buildMapControls() {
    document.querySelectorAll('#map-pattern button').forEach(b =>
        b.addEventListener('click', () => { state.mapPattern = b.dataset.pattern; update(); }));
    const canvas = document.getElementById('map-canvas');
    canvas.addEventListener('mousemove', (e) => {
        if (!mapGeom) return;
        const rc = canvas.getBoundingClientRect(), g = mapGeom;
        const x = e.clientX - rc.left, y = e.clientY - rc.top;
        mapHover = (x >= g.x0 && x <= g.x1 && y >= g.y0 && y <= g.y1) ? { x, y } : null;
        drawMap(canvas);
    });
    canvas.addEventListener('mouseleave', () => { mapHover = null; drawMap(canvas); });
    canvas.addEventListener('click', (e) => {
        if (!mapGeom) return;
        const rc = canvas.getBoundingClientRect();
        const g = mapGeom;
        const x = e.clientX - rc.left, y = e.clientY - rc.top;
        if (x < g.x0 || x > g.x1 || y < g.y0 || y > g.y1) return;
        state.f = g.fAt(x);
        state.r = Math.min(sliderR().max, Math.max(sliderR().min, g.rAt(y)));
        syncSlider('f');
        syncSlider('r');
        update();
    });
}

// Level grid as an offscreen canvas (one pixel per cell); recomputed only when
// pattern, critical distance, capsule diameter or equalisation change
function mapImage() {
    const key = [state.mapPattern, state.rH, state.D, state.omniEq].join('|');
    if (mapCache.key === key) return mapCache.img;
    const off = document.createElement('canvas');
    off.width = MAP.cols; off.height = MAP.rows;
    const octx = off.getContext('2d');
    const img = octx.createImageData(MAP.cols, MAP.rows);
    const opts = { ...VIEWS.overview.opts, eq: { omni: state.omniEq } };
    const lf = Math.log10(MAP.fMax / MAP.fMin), lr = Math.log10(MAP.rMax / MAP.rMin);
    for (let j = 0; j < MAP.rows; j++) {
        // row 0 at the top = largest distance (near at the bottom)
        const r = MAP.rMin * Math.pow(10, lr * (1 - (j + 0.5) / MAP.rows));
        const ref = Physics.levelDb(state.mapPattern, Physics.F_REF, r, state.rH, state.D, opts);
        for (let i = 0; i < MAP.cols; i++) {
            const f = MAP.fMin * Math.pow(10, lf * (i + 0.5) / MAP.cols);
            let db = Physics.levelDb(state.mapPattern, f, r, state.rH, state.D, opts) - ref;
            if (!Number.isFinite(db)) db = -MAP.dbLim;
            const [cr, cg, cb] = mapColor(db);
            const k = 4 * (j * MAP.cols + i);
            img.data[k] = cr; img.data[k + 1] = cg; img.data[k + 2] = cb; img.data[k + 3] = 255;
        }
    }
    octx.putImageData(img, 0, 0);
    mapCache.key = key;
    mapCache.img = off;
    return off;
}

function updateMap() {
    const show = !!VIEWS[state.view].map;
    document.getElementById('map-block').hidden = !show;
    document.querySelectorAll('#map-pattern button').forEach(b =>
        b.classList.toggle('active', b.dataset.pattern === state.mapPattern));
    if (!show) return;
    const t = STRINGS[state.lang];
    const pName = t[PATTERN_STYLE[state.mapPattern].label];
    document.getElementById('map-caption').textContent = t.mapCaption.replace('{p}', pName);
    drawMap(document.getElementById('map-canvas'));
}

function drawMap(canvas) {
    const t = STRINGS[state.lang];
    const { ctx, w, h } = setupCanvas(canvas, MAP.height);
    const padL = 48, padR = 70, padT = 10, padB = 36;
    const x0 = padL, x1 = w - padR, y0 = padT, y1 = h - padB;
    const lf = Math.log10(MAP.fMax / MAP.fMin), lr = Math.log10(MAP.rMax / MAP.rMin);
    const xAt = (f) => x0 + Math.log10(f / MAP.fMin) / lf * (x1 - x0);
    const yAt = (r) => y1 - Math.log10(r / MAP.rMin) / lr * (y1 - y0);
    const fAt = (x) => MAP.fMin * Math.pow(10, (x - x0) / (x1 - x0) * lf);
    const rAt = (y) => MAP.rMin * Math.pow(10, (y1 - y) / (y1 - y0) * lr);
    mapGeom = { x0, x1, y0, y1, fAt, rAt };

    // colour grid
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(mapImage(), x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);

    // axes
    ctx.font = '11px Arial, sans-serif';
    ctx.fillStyle = COLORS.muted;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const f of MAP.fTicks) {
        const x = xAt(f);
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1 + 4); ctx.stroke();
        ctx.fillText(fmtTickFreq(f), x, y1 + 5);
    }
    ctx.textAlign = 'right';
    ctx.fillText(t.freqAxis, x1, y1 + 19);
    ctx.textBaseline = 'middle';
    for (const r of MAP.rTicks) {
        const y = yAt(r);
        ctx.beginPath(); ctx.moveTo(x0 - 4, y); ctx.lineTo(x0, y); ctx.stroke();
        ctx.fillText(fmtLen(r), x0 - 6, y);
    }

    // boundary lines: k·r = 1 (r = c/(2πf)) and r = r_H
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = COLORS.text;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(xAt(MAP.fMin), yAt(Physics.transitionFreq(1) / MAP.fMin));
    ctx.lineTo(xAt(MAP.fMax), yAt(Physics.transitionFreq(1) / MAP.fMax));
    ctx.stroke();
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(x0, yAt(state.rH)); ctx.lineTo(x1, yAt(state.rH)); ctx.stroke();
    ctx.setLineDash([]);
    const label = (txt, x, y) => {
        const tw = ctx.measureText(txt).width;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(x - 2, y - 8, tw + 4, 15);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, x, y);
    };
    // label of the k·r = 1 line where it crosses r = 3 cm (inside the plot for 20 Hz … 1.8 kHz)
    const fLbl = Physics.transitionFreq(0.03);
    label(t.markTrans, xAt(fLbl) + 6, yAt(0.03));
    label(t.zoneMarkH, x0 + 6, yAt(state.rH) - 9);

    // crosshair at the current frequency and distance
    const cxp = xAt(state.f), cyp = yAt(state.r);
    ctx.strokeStyle = COLORS.text;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cxp, y0); ctx.lineTo(cxp, y1);
    ctx.moveTo(x0, cyp); ctx.lineTo(x1, cyp);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cxp, cyp, 5, 0, 2 * Math.PI);
    ctx.fillStyle = 'white'; ctx.fill();
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // colour legend
    const lx = x1 + 18, lw = 14;
    for (let y = y0; y <= y1; y++) {
        const db = MAP.dbLim - (y - y0) / (y1 - y0) * 2 * MAP.dbLim;
        const [cr, cg, cb] = mapColor(db);
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.fillRect(lx, y, lw, 1.5);
    }
    ctx.strokeStyle = COLORS.grid;
    ctx.strokeRect(lx, y0, lw, y1 - y0);
    ctx.fillStyle = COLORS.muted;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (const db of [-15, -10, -5, 0, 5, 10, 15]) {
        const y = y0 + (MAP.dbLim - db) / (2 * MAP.dbLim) * (y1 - y0);
        ctx.fillText((db > 0 ? '+' : db < 0 ? '−' : '') + Math.abs(db), lx + lw + 4, y);
    }
    ctx.textBaseline = 'top';
    ctx.fillText(t.mapLegend, lx, y1 + 5);

    // Value readout at the mouse cursor: frequency, distance and level
    if (mapHover) {
        const fh = fAt(mapHover.x), rh = rAt(mapHover.y);
        const opts = { ...VIEWS.overview.opts, eq: { omni: state.omniEq } };
        const db = Physics.levelNormDb(state.mapPattern, fh, rh, state.rH, state.D, opts);
        drawTooltip(ctx, mapHover.x, mapHover.y, [
            { text: `${fmtFreq(fh)} · ${fmtLen(rh)}`, color: COLORS.text, bold: true },
            { text: `${t[PATTERN_STYLE[state.mapPattern].label]}: ${fmtDb(db)}`, color: COLORS.text }
        ], x0, x1, y0, y1);
    }
}

function drawFrame() {
    if (!document.getElementById('tech').open) return;   // technician block collapsed
    const h = drawWave(document.getElementById('wave-canvas'));
    drawZoom(document.getElementById('zoom-canvas'), h);
    drawTime(document.getElementById('time-canvas'));
}

// ---- animation (requestAnimationFrame; still image with prefers-reduced-motion) ----
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

function tick(now) {
    if (!anim.running) return;
    anim.theta = 2 * Math.PI * ((now - anim.start) / WAVE.periodMs);
    drawFrame();
    requestAnimationFrame(tick);
}

function applyMotionPreference() {
    anim.reduced = motionQuery.matches;
    if (anim.reduced) {
        anim.running = false;
        anim.theta = 0;
        drawFrame();
    } else if (!anim.running) {
        anim.running = true;
        anim.start = performance.now() - anim.theta / (2 * Math.PI) * WAVE.periodMs;
        requestAnimationFrame(tick);
    }
}

// ---- init -----------------------------------------------------------------
buildSliders();
buildTabs();
buildQuick();
setViewRange();
resetFreqView();
buildValues();
buildTimeControls();
buildFreqControls();
buildMapControls();
document.querySelectorAll('.lang-switch button').forEach(b =>
    b.addEventListener('click', () => { state.lang = b.dataset.lang; applyLanguage(); }));
applyLanguage();
motionQuery.addEventListener('change', applyMotionPreference);
window.addEventListener('resize', () => {
    if (!anim.running) drawFrame();
    drawFreq(document.getElementById('freq-canvas'));
    drawScene(document.getElementById('scene-canvas'));
});
document.getElementById('tech').addEventListener('toggle', () => { update(); drawFrame(); });
applyMotionPreference();
runPhysicsTests();
</script>
</body>
</html>
