<title>Einfache Sinusschwingung</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #f3f4f6;
    --ink: #1b2430;
    --ink-soft: #5c6675;
    --panel: #ffffff;
    --panel-2: #edeff2;
    --line: #d8dbe1;
    --accent: #2f5d8a;
    --accent-ink: #1d3c57;
    --warn: #b25c22;
    --scope-bg: #fbfbfc;
    --scope-grid: #e4e7eb;
    --scope-grid-mid: #c7ccd3;
    --scope-trace: #2f6fb0;
    --scope-text: #8b95a3;
    --focus: #2f5d8a;
    --btn-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20, 26, 36, 0.05), 0 8px 24px -12px rgba(20, 26, 36, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10151c;
      --ink: #e7ebf0;
      --ink-soft: #8f99a8;
      --panel: #171e28;
      --panel-2: #1d2531;
      --line: #2a3441;
      --accent: #6ea8dd;
      --accent-ink: #dbe9f7;
      --warn: #e0925a;
      --scope-bg: #12171f;
      --scope-grid: #232c38;
      --scope-grid-mid: #333f4e;
      --scope-trace: #7fb2e0;
      --scope-text: #8496a9;
      --btn-ink: #0d1520;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --paper: #10151c;
    --ink: #e7ebf0;
    --ink-soft: #8f99a8;
    --panel: #171e28;
    --panel-2: #1d2531;
    --line: #2a3441;
    --accent: #6ea8dd;
    --accent-ink: #dbe9f7;
    --warn: #e0925a;
    --scope-bg: #12171f;
    --scope-grid: #232c38;
    --scope-grid-mid: #333f4e;
    --scope-trace: #7fb2e0;
    --scope-text: #8496a9;
    --btn-ink: #0d1520;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding: clamp(14px, 3vw, 28px);
    display: flex;
    justify-content: center;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  .sheet {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .eyebrow {
    margin: 0 0 2px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .console {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 520px) {
    .console { grid-template-columns: 1.3fr 1fr; align-items: start; }
  }

  .readout-block { display: flex; flex-direction: column; gap: 10px; }

  .readout {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .readout .value {
    font-size: clamp(2.2rem, 7vw, 2.9rem);
    font-weight: 600;
    line-height: 1;
    color: var(--accent-ink);
  }

  .readout .unit {
    font-size: 1rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  label.field-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  input[type="number"] {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.95rem;
    width: 100%;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
  }
  input[type="number"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 22px;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--line);
    border-radius: 999px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    margin-top: -7px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    background: var(--line);
    border-radius: 999px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
    cursor: pointer;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; }

  button.chip {
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 11px;
    cursor: pointer;
  }
  button.chip:hover { border-color: var(--accent); }
  button.chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .control-col { display: flex; flex-direction: column; gap: 14px; }

  .play-row { display: flex; align-items: center; gap: 12px; }

  button.play {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--btn-ink);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  button.play:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.play[aria-pressed="true"] { background: var(--warn); }

  .icon { width: 14px; height: 14px; flex: 0 0 auto; }

  .vol-row { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 120px; }
  .vol-row .field-label { flex: 0 0 auto; }

  .scope-card { padding: 0; overflow: hidden; }
  .scope-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .scope-head .field-label { margin: 0; }
  .scope-readouts { display: flex; gap: 16px; font-size: 0.78rem; }
  .scope-readouts b { color: var(--ink); font-weight: 600; }
  .scope-readouts span.k { color: var(--ink-soft); }

  canvas#scope { display: block; width: 100%; height: 200px; background: var(--scope-bg); }

  .range-card { display: flex; flex-direction: column; gap: 8px; }
  .range-bar {
    position: relative;
    height: 26px;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    border: 1px solid var(--line);
  }
  .range-bar .zone-infra { flex: 0 0 4.3023%; background: var(--panel-2); }
  .range-bar .zone-audible {
    flex: 1 1 auto;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, var(--panel-2)), color-mix(in srgb, var(--accent) 55%, var(--panel-2)));
  }
  .range-bar .marker {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--warn);
  }
  .range-bar .marker::after {
    content: "";
    position: absolute;
    top: -3px;
    left: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--warn);
  }
  .range-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--ink-soft); }
  .range-legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--ink-soft); }
  .range-legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

  footer { font-size: 0.72rem; color: var(--ink-soft); text-align: center; padding-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    canvas#scope { }
  }
</style>

<div class="sheet">
  <header>
    <div>
      <span class="eyebrow">Akustik · Schwingungen</span>
      <h1>Einfache Sinusschwingung</h1>
    </div>
  </header>

  <div class="card console">
    <div class="readout-block">
      <div>
        <label class="field-label" for="freqNumber">Frequenz</label>
        <div class="readout">
          <span class="value mono" id="freqValue">440</span>
          <span class="unit">Hz</span>
        </div>
      </div>
      <input type="range" id="freqSlider" min="0" max="1000" step="1" aria-label="Frequenz in Hertz (logarithmisch)">
      <input type="number" id="freqNumber" min="1" max="20000" step="1" value="440" aria-label="Frequenz in Hertz eingeben">
      <div class="presets">
        <button class="chip" data-freq="20" type="button">20 Hz · untere Hörgrenze</button>
        <button class="chip" data-freq="440" type="button">440 Hz · Kammerton A</button>
        <button class="chip" data-freq="20000" type="button">20 000 Hz · obere Hörgrenze</button>
      </div>
    </div>

    <div class="control-col">
      <div class="play-row">
        <button class="play" id="playBtn" type="button" aria-pressed="false">
          <svg class="icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span id="playLabel">Ton abspielen</span>
        </button>
      </div>
      <div class="vol-row">
        <label class="field-label" for="volSlider">Lautstärke</label>
        <input type="range" id="volSlider" min="0" max="100" step="1" value="15" aria-label="Lautstärke">
      </div>
      <div style="display:flex; gap:18px;">
        <div>
          <div class="field-label">Periode T</div>
          <div class="mono" id="periodValue" style="font-size:0.95rem;">2,27 ms</div>
        </div>
        <div>
          <div class="field-label">Wellenlänge λ</div>
          <div class="mono" id="wavelengthValue" style="font-size:0.95rem;">78 cm</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card scope-card">
    <div class="scope-head">
      <span class="field-label">Live-Signal</span>
      <div class="scope-readouts">
        <span><span class="k">Fenster&nbsp;</span><b class="mono" id="windowValue">9,1 ms</b></span>
      </div>
    </div>
    <canvas id="scope" width="1200" height="400"></canvas>
  </div>

  <div class="card range-card">
    <div class="field-label">Hörbereich des Menschen</div>
    <div class="range-bar">
      <div class="zone-infra"></div>
      <div class="zone-audible"></div>
      <div class="marker" id="rangeMarker" style="left: 26%;"></div>
    </div>
    <div class="range-labels">
      <span>1 Hz</span>
      <span>20 Hz</span>
      <span>20 000 Hz</span>
    </div>
    <div class="range-legend">
      <span><span class="dot" style="background:var(--panel-2); border:1px solid var(--line);"></span>Infraschall</span>
      <span><span class="dot" style="background:var(--accent);"></span>Hörbereich</span>
    </div>
  </div>

  <footer>v = 343 m/s (Schallgeschwindigkeit in Luft, 20&nbsp;°C) · λ = v / f · T = 1 / f</footer>
</div>

<script>
(function () {
  "use strict";

  var FREQ_MIN = 1, FREQ_MAX = 20000;
  var LOG_MIN = Math.log10(FREQ_MIN), LOG_MAX = Math.log10(FREQ_MAX);
  var SLIDER_MAX = 1000;
  var CYCLES_SHOWN = 4;

  var freq = 440;
  var playing = false;
  var audioCtx = null, osc = null, gainNode = null;

  var freqSlider = document.getElementById('freqSlider');
  var freqNumber = document.getElementById('freqNumber');
  var freqValue = document.getElementById('freqValue');
  var periodValue = document.getElementById('periodValue');
  var wavelengthValue = document.getElementById('wavelengthValue');
  var windowValue = document.getElementById('windowValue');
  var rangeMarker = document.getElementById('rangeMarker');
  var playBtn = document.getElementById('playBtn');
  var playLabel = document.getElementById('playLabel');
  var playIcon = document.getElementById('playIcon');
  var volSlider = document.getElementById('volSlider');
  var canvas = document.getElementById('scope');
  var ctx = canvas.getContext('2d');

  function freqToSlider(f) {
    var t = (Math.log10(f) - LOG_MIN) / (LOG_MAX - LOG_MIN);
    return Math.round(t * SLIDER_MAX);
  }
  function sliderToFreq(s) {
    var t = s / SLIDER_MAX;
    return Math.pow(10, LOG_MIN + t * (LOG_MAX - LOG_MIN));
  }

  function fmtHz(f) {
    return Math.round(f).toLocaleString('de-DE');
  }
  function fmtMs(ms) {
    var digits = ms < 10 ? 2 : ms < 100 ? 1 : 0;
    return ms.toLocaleString('de-DE', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function setFreq(f, opts) {
    opts = opts || {};
    f = Math.min(FREQ_MAX, Math.max(FREQ_MIN, f));
    freq = f;
    if (!opts.skipSlider) freqSlider.value = freqToSlider(f);
    if (!opts.skipNumber) freqNumber.value = Math.round(f);
    freqValue.textContent = fmtHz(f);

    var periodMs = 1000 / f;
    periodValue.textContent = fmtMs(periodMs) + ' ms';

    var lambdaM = 343 / f;
    if (lambdaM < 1) {
      wavelengthValue.textContent = fmtMs(lambdaM * 100).replace(/\s?ms$/, '') + ' cm';
    } else {
      wavelengthValue.textContent = lambdaM.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' m';
    }

    var windowMs = (CYCLES_SHOWN / f) * 1000;
    windowValue.textContent = fmtMs(windowMs) + ' ms';

    var pct = ((Math.log10(f) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100;
    rangeMarker.style.left = pct + '%';

    if (playing && osc) {
      osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    }
  }

  freqSlider.addEventListener('input', function () {
    setFreq(sliderToFreq(Number(freqSlider.value)), { skipSlider: true });
  });
  freqNumber.addEventListener('input', function () {
    var v = Number(freqNumber.value);
    if (!isNaN(v) && v > 0) setFreq(v, { skipNumber: true });
  });

  document.querySelectorAll('.chip').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setFreq(Number(btn.getAttribute('data-freq')));
    });
  });

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startTone() {
    ensureAudio();
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    var vol = Number(volSlider.value) / 100 * 0.4;
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.03);
    osc.connect(gainNode).connect(audioCtx.destination);
    osc.start();
    playing = true;
    playBtn.setAttribute('aria-pressed', 'true');
    playLabel.textContent = 'Ton stoppen';
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>';
  }

  function stopTone() {
    if (osc && audioCtx) {
      var now = audioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(gainNode.gain.value, now);
      gainNode.gain.linearRampToValueAtTime(0, now + 0.03);
      osc.stop(now + 0.05);
    }
    playing = false;
    playBtn.setAttribute('aria-pressed', 'false');
    playLabel.textContent = 'Ton abspielen';
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
  }

  playBtn.addEventListener('click', function () {
    if (playing) stopTone(); else startTone();
  });

  volSlider.addEventListener('input', function () {
    if (playing && gainNode && audioCtx) {
      var vol = Number(volSlider.value) / 100 * 0.4;
      gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
    }
  });

  // --- Oscilloscope canvas ---
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var h = rect.height || 200;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(h * dpr);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  var t0 = performance.now();

  function drawScope(now) {
    requestAnimationFrame(drawScope);
    var w = canvas.width, h = canvas.height;
    if (w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = getVar('--scope-bg');
    ctx.fillRect(0, 0, w, h);

    var gridColor = getVar('--scope-grid');
    var midColor = getVar('--scope-grid-mid');
    var textColor = getVar('--scope-text');
    var traceColor = getVar('--scope-trace');

    var cols = 8, rows = 4;
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (var c = 1; c < cols; c++) {
      var x = Math.round((c / cols) * w) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (var r = 1; r < rows; r++) {
      var y = Math.round((r / rows) * h) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.strokeStyle = midColor;
    ctx.beginPath(); ctx.moveTo(0, h / 2 + 0.5); ctx.lineTo(w, h / 2 + 0.5); ctx.stroke();

    var elapsed = (now - t0) / 1000;
    var windowSpan = CYCLES_SHOWN / freq;
    var amp = h * 0.36;
    var midY = h / 2;

    ctx.beginPath();
    ctx.strokeStyle = traceColor;
    ctx.lineWidth = Math.max(2, 2 * dpr);
    ctx.lineJoin = 'round';

    var steps = w;
    for (var i = 0; i <= steps; i++) {
      var xr = i / steps;
      var t = elapsed * 0.35 + xr * windowSpan;
      var y = midY - Math.sin(2 * Math.PI * freq * t) * amp;
      var x = xr * w;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = textColor;
    ctx.font = (11 * dpr) + 'px "IBM Plex Mono", monospace';
    ctx.fillText('0 ms', 6 * dpr, h - 6 * dpr);
    var endLabel = (windowSpan * 1000).toFixed(windowSpan * 1000 < 10 ? 2 : 1) + ' ms';
    var tw = ctx.measureText(endLabel).width;
    ctx.fillText(endLabel, w - tw - 6 * dpr, h - 6 * dpr);
  }

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  requestAnimationFrame(drawScope);

  setFreq(440);
})();
</script>
